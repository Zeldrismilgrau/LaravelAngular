<ion-content [fullscreen]="true">

    <ion-button color="secondary" (click)="this.listarProdutos()">Teste</ion-button>
    
    <ng-container *ngFor="let produto of this.produtos">
        <h1>Código: {{produto.id}}</h1>
        <h1>Nome: {{produto.nome}}</h1>
        <h1>Preço: {{produto.preco}}</h1>
    </ng-container>
    
</ion-content>
